[package]
name = "linuxify"
version = "0.2.0"
edition = "2021"
description = "Helps you move from Windows to Linux: scan, choose a distro, try it, stage your data, install."
license = "MIT"
repository = "https://github.com/tiiow-fedora/linuxify"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.10"
fs2 = "0.4"
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "links", "wgpu", "glow"] }
rfd = "0.17"
wry = { version = "0.57.1", optional = true }
tao = { version = "0.37.2", optional = true }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[profile.release]
lto = true
codegen-units = 1

[features]
# The website quiz in a web view (WebView2 on Windows). Off by default until it has been
# built and clicked through on Windows; see DECISIONS.md. Build with `--features webview`.
webview = ["dep:wry", "dep:tao"]

[dev-dependencies]
proptest = "1"
