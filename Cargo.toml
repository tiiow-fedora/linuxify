[package]
name = "linuxify"
version = "0.1.0"
edition = "2021"
description = "Helps you move from Windows to Linux: scan, choose a distro, try it, stage your data, install."
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[profile.release]
lto = true
codegen-units = 1
