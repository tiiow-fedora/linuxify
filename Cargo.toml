[package]
name = "linuxify"
version = "0.1.0"
edition = "2021"
description = "Helps you move from Windows to Linux: scan, choose a distro, try it, stage your data, install."
license = "MIT"
repository = "https://github.com/tiiow-fedora/linuxify"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.10"
fs2 = "0.4"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[profile.release]
lto = true
codegen-units = 1
