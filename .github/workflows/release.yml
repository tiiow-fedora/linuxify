# Builds linuxify.exe and publishes it as a GitHub release when a version tag
# (v0.1.0, ...) is pushed. The tag must match the version in Cargo.toml.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Tag matches Cargo.toml
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne $env:GITHUB_REF_NAME) { throw "tag $env:GITHUB_REF_NAME doesn't match Cargo.toml version $v" }
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --locked --release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target\release\linuxify.exe dist\
          $h = (Get-FileHash dist\linuxify.exe -Algorithm SHA256).Hash.ToLower()
          "$h  linuxify.exe" | Out-File -Encoding ascii dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          **Experimental.** ``linuxify install`` repartitions your disk. It has only been tested in VirtualBox VMs, never on real hardware. Read the safety warning in the README and back up first.

          Download ``linuxify.exe`` (Windows 10/11, x64) and double-click it to open the window, or run it from a terminal, e.g. ``linuxify scan --open``. It isn't code-signed, so Windows SmartScreen may warn the first time. Check the file against ``SHA256SUMS.txt``.
          "@
          gh release create $env:GITHUB_REF_NAME dist\linuxify.exe dist\SHA256SUMS.txt --title "Linuxify $env:GITHUB_REF_NAME" --notes $notes --prerelease
